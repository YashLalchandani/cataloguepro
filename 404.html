<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script>
/* Base path: GitHub Pages serves this site under /cataloguepro, Netlify serves it from the root.
   Set a <base> first so every relative asset and link below resolves under the right base. */
(function(){var seg=window.location.pathname.split("/").filter(Boolean);var base=seg[0]==="cataloguepro"?"/cataloguepro/":"/";var b=document.createElement("base");b.href=base;document.head.appendChild(b);})();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Catalogue Pro — Create Your Digital Catalog in Minutes</title>
<meta name="description" content="Catalogue Pro: build a beautiful mobile catalog, share it on WhatsApp and Instagram, and receive orders instantly. Lyfex Digital Comic Store is live on Catalogue Pro.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,400;0,600;0,700;0,800;0,900;1,700;1,900&display=swap" rel="stylesheet">
<style>
/* Catalogue Pro comic-print design tokens, copied from the live Catalogue Pro artifact */
:root{
  --bg:#fff8ec; --surface:#fffdf7; --surface-alt:#f7ecd7; --text:#16130e; --dim:#6b5d43;
  --border:#e7dcc4; --accent:#d97706; --accent-strong:#b45309; --on-accent:#ffffff;
  --band:#16130e; --band-line:rgba(255,248,236,.25); --crimson:#dc2626; --wa:#16a34a; --ink:#16130e;
  --font-display:'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif;
}
:root[data-theme="dark"]{
  --bg:#171310; --surface:#221c16; --surface-alt:#2c241b; --text:#f7ecd7; --dim:#cdbd97;
  --border:#57492f; --accent:#f59e0b; --accent-strong:#fcd34d; --on-accent:#221503;
  --band:#f7ecd7; --band-line:rgba(23,19,16,.25); --crimson:#f87171; --wa:#4ade80; --ink:#0d0a07;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme]){
    --bg:#171310; --surface:#221c16; --surface-alt:#2c241b; --text:#f7ecd7; --dim:#cdbd97;
    --border:#57492f; --accent:#f59e0b; --accent-strong:#fcd34d; --on-accent:#221503;
    --band:#f7ecd7; --band-line:rgba(23,19,16,.25); --crimson:#f87171; --wa:#4ade80; --ink:#0d0a07;
  }
}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);line-height:1.5}
a{color:var(--accent-strong);text-decoration:none}
a:hover{text-decoration:underline}
button{font:inherit;cursor:pointer}
img{max-width:100%;display:block}
.container{max-width:1152px;margin:0 auto;padding:0 16px}
h1,h2,h3{font-family:var(--font-display);letter-spacing:-.02em}
.hidden{display:none!important}

/* Halftone dot texture */
.halftone{position:relative;overflow:hidden}
.halftone::before{content:"";position:absolute;inset:0;background-image:radial-gradient(var(--ink) 1.1px,transparent 1.2px);background-size:10px 10px;opacity:.10;pointer-events:none}
.halftone>.container{position:relative;z-index:1}

/* Header */
header.site{position:sticky;top:0;z-index:50;background:var(--bg);border-bottom:2px solid var(--border)}
.header-in{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 16px;max-width:1152px;margin:0 auto}
.logo{display:flex;align-items:center;gap:10px}
.logo:hover{text-decoration:none}
.logo-mark{width:32px;height:32px;background:var(--accent);color:#fff;display:grid;place-items:center;font:900 16px var(--font-display);border:2px solid var(--ink);box-shadow:2.5px 2.5px 0 0 var(--ink)}
.wordmark{font:900 20px var(--font-display);letter-spacing:-.02em;color:var(--text)}
.wordmark .pro{color:var(--accent-strong)}
nav.main{display:flex;gap:4px;margin-left:8px}
nav.main a{color:var(--text);padding:8px 10px;font-size:14px;font-weight:700}
nav.main a:hover{text-decoration:none;background:var(--surface-alt)}
@media(max-width:760px){nav.main{display:none}}
.header-actions{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.seg{display:flex;border:2px solid var(--ink);background:var(--surface)}
.seg-btn{border:none;background:transparent;padding:6px 10px;font:800 11px var(--font-display);text-transform:uppercase;letter-spacing:.05em;color:var(--text);opacity:.7}
.seg-btn:hover{opacity:1}
.seg-btn.active{background:var(--accent);color:var(--on-accent);opacity:1}

/* Buttons — square, 2px ink border, hard offset shadow */
.btn{display:inline-block;padding:11px 18px;border:2px solid var(--ink);border-radius:0;background:var(--surface);color:var(--text);font:800 15px var(--font-display);text-align:center}
.btn:hover{text-decoration:none;filter:brightness(.97)}
.btn-primary{background:var(--accent);color:var(--on-accent);box-shadow:2.5px 2.5px 0 0 var(--ink)}
.btn-wa{background:var(--wa);color:#fff;box-shadow:2.5px 2.5px 0 0 var(--ink)}
.btn-band{background:var(--band);color:var(--bg);box-shadow:2.5px 2.5px 0 0 var(--ink)}
.btn-hero{padding:12px 20px;box-shadow:4px 4px 0 0 var(--ink)}
.btn-sm{padding:8px 12px;font-size:14px}
.btn-cta{border-color:var(--bg)}

/* Hero */
.hero{border-bottom:4px solid var(--ink);padding:40px 0 56px}
@media(min-width:640px){.hero{padding-top:56px}}
.eyebrow{display:inline-block;border:2px solid var(--ink);background:var(--surface);padding:6px 12px;font:900 11px var(--font-display);letter-spacing:.18em;text-transform:uppercase}
.hero h1{font-size:36px;line-height:1.05;font-weight:900;margin:16px 0;max-width:640px}
@media(min-width:640px){.hero h1{font-size:48px}}
.hero p.lead{font-size:16px;color:var(--dim);max-width:560px;margin:0 0 24px}
@media(min-width:640px){.hero p.lead{font-size:18px}}
.hero .cta-row{display:flex;gap:12px;flex-wrap:wrap}
.hero .footnote{font-size:12px;font-weight:600;color:var(--dim);margin:18px 0 0}

/* Sections */
.section{padding:44px 0}
.section h2{font-size:28px;font-weight:900;margin:0 0 8px}
.section p.sub{color:var(--dim);margin:0 0 20px}
.features-sec{background:var(--surface-alt);border-top:4px solid var(--ink);border-bottom:4px solid var(--ink)}

/* Live store showcase */
.showcase-card{background:var(--surface);border:2px solid var(--ink);box-shadow:4px 4px 0 0 var(--ink);padding:20px;display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.showcase-card img.logo-img{width:80px;height:80px;object-fit:cover;border:2px solid var(--ink);background:#fff}
.eyebrow-sm{font:900 11px var(--font-display);letter-spacing:.18em;text-transform:uppercase;color:var(--accent-strong)}
.showcase-card h3{font-size:24px;font-weight:900;margin:4px 0}
.showcase-card p{margin:0;color:var(--dim);font-size:14px}
.showcase-card .btn{margin-left:auto}

/* Theme picker demo */
.showcase{display:grid;grid-template-columns:1fr;gap:20px;align-items:start}
@media(min-width:1024px){.showcase{grid-template-columns:280px 1fr}}
.showcase h3{font-size:18px;font-weight:800;margin:0 0 12px}
.theme-list{display:flex;flex-direction:column;gap:10px}
.theme-btn{display:flex;gap:12px;align-items:center;text-align:left;background:var(--surface);border:2px solid var(--border);padding:10px 12px;color:var(--text)}
.theme-btn.active{border-color:var(--ink);box-shadow:2.5px 2.5px 0 0 var(--ink)}
.theme-btn .swatch{width:32px;height:32px;border:2px solid var(--ink);flex:none}
.theme-btn strong{display:block;font:800 14px var(--font-display)}
.theme-btn small{font-size:12px;color:var(--dim)}
.checklist{list-style:none;padding:0;margin:20px 0 0;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.checklist li{font-weight:600;font-size:14px}
.checklist li::before{content:"✓ ";color:var(--wa);font-weight:900}
.preview{border:2px solid var(--ink)}
.mini-head{display:flex;align-items:center;gap:10px;padding:10px 12px}
.mini-head img{width:40px;height:40px;object-fit:cover;border:2px solid}
.mini-head .mini-name{font:900 18px var(--font-display)}
.mini-head .mini-cart{margin-left:auto;padding:4px 10px;font:800 12px var(--font-display);color:#fff}
.mini-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:12px}
@media(min-width:768px){.mini-grid{grid-template-columns:repeat(4,1fr)}}
.mini-card{border:2px solid;overflow:hidden}
.mini-card img{width:100%;aspect-ratio:3/4;object-fit:cover;display:block}
.mini-card .mini-body{padding:8px}
.mini-card .mini-title{font:800 12px var(--font-display);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.mini-card .mini-row{display:flex;justify-content:space-between;align-items:center;margin-top:6px}
.mini-card .mini-price{font:900 14px var(--font-display)}
.mini-card .mini-add{padding:2px 8px;font:800 12px var(--font-display);color:#fff}

/* Features + steps */
.grid-features{display:grid;grid-template-columns:1fr;gap:16px}
@media(min-width:640px){.grid-features{grid-template-columns:repeat(2,1fr)}}
@media(min-width:1024px){.grid-features{grid-template-columns:repeat(3,1fr)}}
.feature-card{background:var(--surface);border:2px solid var(--ink);padding:16px}
.feature-card h3{font-size:16px;font-weight:800;margin:0 0 6px}
.feature-card p{margin:0;color:var(--dim);font-size:14px}
.steps{display:grid;grid-template-columns:1fr;gap:16px;text-align:center;margin-top:32px}
@media(min-width:640px){.steps{grid-template-columns:repeat(3,1fr)}}
.step-num{width:40px;height:40px;background:var(--accent);color:var(--on-accent);border:2px solid var(--ink);box-shadow:2.5px 2.5px 0 0 var(--ink);display:grid;place-items:center;font:900 18px var(--font-display);margin:0 auto 10px}
.steps h3{font-size:16px;font-weight:800;margin:0 0 6px}
.steps p{margin:0;color:var(--dim);font-size:14px}

/* Pricing */
.pricing{display:grid;grid-template-columns:1fr;gap:16px;align-items:stretch}
@media(min-width:640px){.pricing{grid-template-columns:repeat(2,1fr)}}
@media(min-width:1280px){.pricing{grid-template-columns:repeat(4,1fr)}}
.plan{position:relative;background:var(--surface);border:2px solid var(--ink);padding:20px;display:flex;flex-direction:column}
.plan.popular{box-shadow:4px 4px 0 0 var(--ink)}
.plan h3{font-size:18px;font-weight:900;margin:0}
.plan .blurb{font-size:12px;color:var(--dim);margin:6px 0 0}
.plan .price{font:900 30px var(--font-display);margin:10px 0 0}
.plan .price small{font-size:14px;color:var(--dim);font-weight:600}
.plan ul{margin:14px 0;padding-left:0;list-style:none;flex:1}
.plan li{margin:6px 0;font-size:14px}
.plan li::before{content:"✓ ";color:var(--wa);font-weight:900}
.plan .btn{margin-top:12px;width:100%}
.badge-pop{position:absolute;top:-13px;left:16px;background:var(--crimson);color:#fff;font:900 11px var(--font-display);text-transform:uppercase;padding:4px 10px;border:2px solid var(--ink)}
.plan .ads-note{color:var(--dim);font-size:13px;margin:10px 0 0}

/* CTA band + footer */
.cta-band{background:var(--band);color:var(--bg);border-top:4px solid var(--ink);padding:40px 0;text-align:center}
.cta-band h2{font-size:24px;font-weight:900;margin:0 0 8px}
@media(min-width:640px){.cta-band h2{font-size:30px}}
.cta-band p.sub{opacity:.8;max-width:560px;margin:0 auto 20px;font-size:14px}
.foot-row{margin-top:28px;padding-top:20px;border-top:1px solid var(--band-line);font-size:12px;opacity:.8}
.foot-row a{color:inherit;text-decoration:underline;font-weight:700}

/* Store */
.store-banner{background:var(--band);color:var(--bg);border-bottom:4px solid var(--ink);padding:12px 0}
.store-banner.halftone::before{background-image:radial-gradient(var(--bg) 1.1px,transparent 1.2px);opacity:.15}
.store-banner-in{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.store-banner .logo-img{width:48px;height:48px;object-fit:cover;border:2px solid var(--bg);background:#fff}
.store-banner h1{font-style:italic;font-size:24px;font-weight:900;letter-spacing:-.02em;margin:0}
@media(min-width:640px){.store-banner h1{font-size:30px}}
.store-banner p{margin:0;font-size:12px;opacity:.8}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:20px 0}
.search-input{flex:1;min-width:200px;padding:12px 16px;font-size:16px;border:2px solid var(--ink);box-shadow:2.5px 2.5px 0 0 var(--ink);background:var(--surface);color:var(--text)}
select{padding:10px 12px;border:2px solid var(--border);border-radius:0;background:var(--surface);color:var(--text);font:inherit}
.pills{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 18px}
.pill-btn{padding:8px 14px;border:2px solid var(--ink);border-radius:0;background:var(--surface);color:var(--text);font:800 13px var(--font-display)}
.pill-btn.active{background:var(--accent);color:var(--on-accent)}
.grid-products{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:600px){.grid-products{grid-template-columns:repeat(3,1fr);gap:16px}}
@media(min-width:1024px){.grid-products{grid-template-columns:repeat(4,1fr)}}
@media(min-width:1280px){.grid-products{grid-template-columns:repeat(5,1fr)}}
.product{background:var(--surface);border:2px solid var(--ink);box-shadow:2.5px 2.5px 0 0 var(--ink);overflow:hidden;display:flex;flex-direction:column;cursor:pointer}
.product img.cover{width:100%;aspect-ratio:3/4;object-fit:cover;display:block;background:#e2e8f0}
.cover.fallback{aspect-ratio:3/4;display:flex;flex-direction:column;justify-content:space-between;padding:10px;position:relative;overflow:hidden}
.cover.fallback::after{content:"";position:absolute;inset:0;background-image:radial-gradient(currentColor 1.1px,transparent 1.2px);background-size:10px 10px;opacity:.2;pointer-events:none}
.fb-top{display:flex;justify-content:space-between;gap:6px;font:900 10px var(--font-display);letter-spacing:.18em;text-transform:uppercase;position:relative;z-index:1}
.fb-mid{position:relative;z-index:1;text-align:center}
.fb-num{font:italic 900 60px/1 var(--font-display)}
.fb-title{font:800 16px/1.2 var(--font-display);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;margin-top:6px}
.fb-bottom{display:flex;justify-content:space-between;gap:6px;font:900 10px var(--font-display);letter-spacing:.2em;position:relative;z-index:1}
.product .body{padding:10px;display:flex;flex-direction:column;gap:4px;flex:1}
.product h3{font-size:14px;font-weight:800;line-height:1.3;margin:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.product .meta{font-size:12px;color:var(--dim)}
.product .stock{font-size:12px;font-weight:600}
.product .stock.low{color:var(--accent-strong)}
.product .stock.out{color:var(--crimson)}
.product .row{display:flex;justify-content:space-between;align-items:flex-end;gap:8px;margin-top:auto;padding-top:8px}
.price{font:900 16px var(--font-display)}
.mrp{font-size:12px;color:var(--dim);text-decoration:line-through;margin-left:6px}
.per-pc{display:block;font-size:10px;color:var(--dim)}
.badge{display:inline-block;font:900 10px var(--font-display);text-transform:uppercase;letter-spacing:.08em;padding:2px 8px;border-radius:0;align-self:flex-start}
.badge.hot{background:var(--crimson);color:#fff}
.badge.std{background:var(--band);color:var(--bg)}
.add-btn{padding:4px 10px;border:2px solid var(--ink);border-radius:0;background:var(--accent);color:var(--on-accent);font:900 13px var(--font-display);box-shadow:2.5px 2.5px 0 0 var(--ink)}
.add-btn:disabled{opacity:.4}
.empty{padding:40px;text-align:center;color:var(--dim)}
footer.site{border-top:2px solid var(--border);padding:20px 0;text-align:center;color:var(--dim);font-size:14px}
footer.site a{font:900 16px var(--font-display);color:var(--accent-strong);text-decoration:underline}

/* Forms, drawer, modal */
input,textarea{padding:10px 12px;border:2px solid var(--border);border-radius:0;background:var(--surface);color:var(--text);font:inherit;width:100%}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--accent)}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;z-index:100}
.overlay.open{display:block}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(420px,94vw);background:var(--surface);color:var(--text);z-index:101;transform:translateX(100%);transition:transform .2s;overflow:auto;padding:20px;border:2px solid var(--ink);border-right:none}
.drawer.open{transform:none}
.modal{position:fixed;inset:0;z-index:102;display:none;place-items:center;padding:16px}
.modal.open{display:grid}
.modal-card{background:var(--surface);color:var(--text);border:2px solid var(--ink);box-shadow:4px 4px 0 0 var(--ink);border-radius:0;max-width:560px;width:100%;max-height:90vh;overflow:auto;padding:22px}
.modal-card h2{margin-top:0;font-size:22px;font-weight:900}
.field{margin-bottom:12px}
.field label{display:block;font-weight:700;margin-bottom:6px}
.field .req{color:var(--crimson)}
.cart-item{display:flex;gap:10px;border-bottom:2px solid var(--border);padding:10px 0;align-items:center}
.cart-item img{width:52px;height:70px;object-fit:cover;border:2px solid var(--ink)}
.qty{display:flex;gap:8px;align-items:center}
.qty button{min-width:30px;height:30px;border:2px solid var(--ink);background:var(--surface);color:var(--text);font-weight:800}
.detail-img{border:2px solid var(--ink);overflow:hidden}
.detail-img img{width:100%;aspect-ratio:3/4;object-fit:cover;display:block}
.note{background:var(--surface-alt);border:2px solid var(--ink);padding:14px;color:var(--text)}
.cart-fab{position:fixed;right:12px;bottom:12px;left:12px;z-index:60;background:var(--wa);color:#fff;border:2px solid var(--ink);box-shadow:2.5px 2.5px 0 0 var(--ink);padding:12px 16px;font:800 15px var(--font-display);text-align:center}
@media(min-width:640px){.cart-fab{display:none}}

/* Store page: the platform header is hidden; controls live in the store toolbar */
body.store-page header.site{display:none}
.store-toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:14px 16px 0}
.store-toolbar .seg{flex:none}
.store-toolbar .spacer{flex:1}
.btn-share{background:var(--wa);color:#fff;box-shadow:2.5px 2.5px 0 0 var(--ink)}
.btn-share svg{vertical-align:-2px;margin-right:6px}

/* Share modal */
.modal-card.share-card{max-width:420px}
.share-head{display:flex;justify-content:space-between;align-items:center;gap:12px}
.share-head h2{margin:0;font-size:20px;font-weight:900}
.share-close{border:2px solid var(--ink);background:var(--surface);color:var(--text);width:32px;height:32px;font:900 15px var(--font-display);flex:none}
.share-qr{background:#d9f2e3;border-radius:16px;padding:20px 16px 14px;text-align:center;margin:16px 0 12px}
.share-qr img{width:200px;height:200px;margin:0 auto;background:#fff;padding:10px;border-radius:8px}
.share-qr p{margin:10px 0 0;color:#334155;font-size:14px}
.share-link{display:flex;margin:0 0 12px}
.share-link input{flex:1;border:2px solid var(--ink);border-right:none;padding:10px 12px;font-size:13px;color:var(--dim);background:var(--surface);min-width:0}
.share-link .btn{flex:none}
.share-apps{width:100%;background:#16a34a;color:#fff;border:2px solid var(--ink);box-shadow:2.5px 2.5px 0 0 var(--ink);padding:12px;font:800 15px var(--font-display);margin-bottom:12px}
.share-row{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.share-svc{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;padding:12px 4px;border:2px solid var(--ink);border-radius:12px;color:#fff;font:800 12px var(--font-display);text-align:center}
.share-svc:hover{text-decoration:none;filter:brightness(1.06)}
.share-svc.wa{background:#25d366}
.share-svc.fb{background:#1877f2}
.share-svc.tw{background:#000}
.share-svc.ig{background:linear-gradient(45deg,#f58529,#dd2a7b,#8134af,#515bd4)}
.share-svc svg{width:22px;height:22px;fill:#fff}
</style>
</head>
<body>
<header class="site">
  <div class="header-in">
    <a class="logo" href="."><span class="logo-mark">C</span><span class="wordmark">Catalogue<span class="pro">Pro</span></span></a>
    <nav class="main">
      <a href="#features" data-i18n="nav_features">Features</a>
      <a href="#pricing" data-i18n="nav_pricing">Pricing</a>
    </nav>
    <div class="header-actions">
      <div class="seg" id="langSeg" role="group" aria-label="Language">
        <button class="seg-btn active" data-lang="en">EN</button>
        <button class="seg-btn" data-lang="hi">हिंदी</button>
        <button class="seg-btn" data-lang="bn">বাংলা</button>
      </div>
      <div class="seg" id="themeSeg" role="group" aria-label="Theme">
        <button class="seg-btn active" data-theme-btn="auto">Auto</button>
        <button class="seg-btn" data-theme-btn="light">Light</button>
        <button class="seg-btn" data-theme-btn="dark">Dark</button>
      </div>
      <a class="btn btn-sm" href="store/lyfexdigital-comic-store" data-i18n="live_store">Live store</a>
      <button class="btn btn-sm btn-band" id="loginBtn" data-i18n="login">Log in</button>
      <button class="btn btn-sm btn-wa" id="cartBtnTop">🛒 <span data-i18n="cart">Cart</span> (<span id="cartCountTop">0</span>)</button>
    </div>
  </div>
</header>
<main id="app"></main>
<div class="overlay" id="overlay"></div>
<aside class="drawer" id="cartDrawer" aria-label="Cart">
  <div style="display:flex;justify-content:space-between;align-items:center"><h2 data-i18n="your_cart" style="font-size:22px">Your Cart</h2><button class="btn btn-sm" id="closeCart">✕</button></div>
  <div id="cartItems"></div>
  <p style="font-size:18px;font-weight:900;font-family:var(--font-display)"><span data-i18n="total">Total</span>: ₹<span id="cartTotal">0</span></p>
  <button class="btn btn-primary" id="checkoutBtn" style="width:100%" data-i18n="order_whatsapp">Order on WhatsApp</button>
  <p style="color:var(--dim);font-size:13px" data-i18n="cart_note">Delivery details will be asked before sending the order on WhatsApp.</p>
</aside>
<div class="modal" id="modal"><div class="modal-card" id="modalCard"></div></div>
<button class="cart-fab hidden" id="cartFab"></button>
<script src="app.js"></script>
</body>
</html>
